name: Platform update
description: Report a post-publication platform change.
title: "[Platform Update] "
labels: ["platform-update"]
body:
  - type: input
    id: platform
    attributes:
      label: Platform and version
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Authoritative reference
    validations:
      required: true
